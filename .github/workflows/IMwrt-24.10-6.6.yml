name: ImmortalWrt-24.10-6.6固件构建

on:
  repository_dispatch:
    types: [build_firmware]
  workflow_dispatch:
    inputs:
      enable_5g_25db:
        description: '启用5G 25dB修改'
        type: boolean
        required: true
        default: true
      repo_url:
        description: '源代码仓库URL'
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-24.10'
      repo_branch:
        description: '源代码仓库分支'
        default: 'openwrt-24.10-6.6'
  schedule:
    - cron: '35 5 * * 1'   # 每周一 05:35 UTC（北京时间 13:35）

permissions:
  contents: write
  actions: write

env:
  REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/padavanonly/immortalwrt-mt798x-24.10' }}
  REPO_BRANCH: ${{ github.event.inputs.repo_branch || 'openwrt-24.10-6.6' }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 24.10-6.6.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  DEVICE_CODE: cmcc_rax3000m-emmc
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
  WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
  WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
  ENABLE_5G_25DB: ${{ github.event.inputs.enable_5g_25db || true }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 打印调试信息
        run: |
          echo "触发类型：${{ github.event_name }}"
          echo "设备型号：${{ env.DEVICE_CODE }}"
          echo "5G 25dB：${{ env.ENABLE_5G_25DB }}"

      - uses: actions/checkout@v4

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.aliyun.com/' /etc/apt/sources.list
          sudo mkdir -p /var/cache/apt/archives && sudo chown $USER:$GROUPS /var/cache/apt/archives
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            build-essential ccache git gawk gcc-multilib g++-multilib libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-pip python3-ply python3-pyelftools rsync unzip wget zlib1g-dev squashfs-tools device-tree-compiler \
            binutils bison flex gh
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ" || true
          sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir
          echo "export PATH=/usr/lib/ccache:\$PATH" >> $GITHUB_ENV
          echo "export CCACHE_DIR=\$HOME/.ccache" >> $GITHUB_ENV
          ccache -M 5G

      - uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            /workdir/openwrt/dl
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/toolchain*
          key: ${{ runner.os }}-build-24.10-cmcc_rax3000m-emmc
          restore-keys: ${{ runner.os }}-build-24.10-

      - name: 克隆或更新源代码
        working-directory: /workdir
        run: |
          # 缓存只恢复 dl/staging_dir，/workdir/openwrt 可能是残缺目录，
          # 必须用 .git 判断是否是真源码树，残缺则清空重来
          if [ -d "openwrt/.git" ]; then
            cd openwrt && git fetch origin $REPO_BRANCH && git reset --hard origin/$REPO_BRANCH
          else
            rm -rf openwrt
            for i in {1..3}; do
              git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt && break
              echo "克隆失败，重试 $i/3"
              rm -rf openwrt
              sleep 5
            done
          fi
          [ -f openwrt/scripts/feeds ] || { echo "ERROR: openwrt 源码不完整 (scripts/feeds 缺失)"; exit 1; }
          echo "openwrt 源码就绪: $(git -C openwrt rev-parse --short HEAD)"
          rm -rf $GITHUB_WORKSPACE/openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          ls $GITHUB_WORKSPACE/openwrt/scripts/feeds && echo "符号链接验证通过"

      - name: 准备Feeds和配置
        run: |
          echo "cwd=$(pwd)"; echo "openwrt -> $(readlink -f openwrt)"; ls openwrt/scripts/feeds
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${{ env.DEVICE_CODE }}=y" >> openwrt/.config
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          $GITHUB_WORKSPACE/$DIY_P2_SH

          # 注入 cmcc_rax3000m-emmc (U-Boot mod，输出 sysupgrade.itb)
          python3 $GITHUB_WORKSPACE/scripts/inject-emmc-device.py
          grep -A3 "^define Device/cmcc_rax3000m-emmc$" target/linux/mediatek/image/filogic.mk || { echo "ERROR: 设备定义注入失败"; exit 1; }

          # 诊断版 defconfig：失败不退出，收集完整诊断信息
          set +e
          make defconfig > defconfig.log 2>&1
          echo "=== defconfig exit code: $?"
          echo "=== defconfig 输出尾部:"
          tail -40 defconfig.log
          echo "=== 1. tmp/.targetinfo 注入设备行数:"
          grep -n "cmcc_rax3000m-emmc" tmp/.targetinfo || echo "(targetinfo 无此设备)"
          echo "=== 2. tmp/.config-target.in 注入设备上下文:"
          grep -n -B2 -A3 "DEVICE_cmcc_rax3000m-emmc" tmp/.config-target.in | head -40 || echo "(Kconfig 无此设备)"
          echo "=== 3. .config 设备行:"
          grep -n "cmcc_rax3000m-emmc" .config || echo "(.config 无此设备)"
          echo "=== 4. .config 目标相关状态:"
          grep -n "^CONFIG_TARGET_mediatek\b\|^# CONFIG_TARGET_mediatek\b\|^CONFIG_TARGET_mediatek_filogic\b\|^# CONFIG_TARGET_mediatek_filogic\b\|CONFIG_TARGET_MULTI_PROFILE" .config
          echo "=== 5. defconfig 中的 unknown/nonexistent 警告:"
          grep -i "nonexistent\|unknown symbol" defconfig.log
          echo "=== 6. 注入设备定义位置:"
          grep -n "define Device/cmcc_rax3000m-emmc" target/linux/mediatek/image/filogic.mk
          wc -l target/linux/mediatek/image/filogic.mk
          if grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y" .config; then
            echo "RESULT: OK"
          else
            echo "RESULT: FAIL"
          fi
          set -e
          cp defconfig.log $GITHUB_WORKSPACE/defconfig.log 2>/dev/null || true
          cp tmp/.config-target.in $GITHUB_WORKSPACE/config-target.in 2>/dev/null || true
          cp tmp/.targetinfo $GITHUB_WORKSPACE/targetinfo 2>/dev/null || true
          cp .config $GITHUB_WORKSPACE/dot-config 2>/dev/null || true
          if ! grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y" .config; then
            echo "KCONFIG_PARSE_FAILED=1" >> $GITHUB_ENV
            echo "诊断信息已保存，请在 Actions 日志中查看"
            exit 0
          fi
          grep -c "DEVICE_cmcc_rax3000m-emmc" .config
          make download -j8 || make download -j1 V=s

      - name: 修改5G 25dB
        if: env.ENABLE_5G_25DB == 'true'
        working-directory: ./openwrt
        run: |
          EEPROM_FILE=package/mtk/drivers/mt_wifi/files/mt7981-default-eeprom/MT7981_iPAiLNA_EEPROM.bin
          EXPECTED_CONTENT=$(printf '\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B')
          mkdir -p "$(dirname "$EEPROM_FILE")" && touch "$EEPROM_FILE" && chmod 644 "$EEPROM_FILE"
          CURRENT_CONTENT=$(dd if="$EEPROM_FILE" bs=1 skip=$((0x445)) count=20 2>/dev/null || echo "")
          [ "$CURRENT_CONTENT" != "$EXPECTED_CONTENT" ] && printf '\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B\x2B' | dd of="$EEPROM_FILE" bs=1 seek=$((0x445)) conv=notrunc

      - name: 编译固件
        id: compile
        if: env.KCONFIG_PARSE_FAILED != '1'
        timeout-minutes: 180
        run: |
          set -e
          cd openwrt
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 5G
          ccache -z

          THREADS=$(( $(nproc) + 10 ))
          echo "检测到系统 CPU 核心数: $(nproc)"
          echo "优化后的并发编译线程数: $THREADS"

          make -j$THREADS || make -j1 V=s
          ccache -s
          echo "status=success" >> $GITHUB_OUTPUT

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ env.DEVICE_CODE }}
          path: |
            openwrt/logs/**/*
            openwrt/*.log
            defconfig.log
            config-target.in
            targetinfo
            dot-config
          if-no-files-found: ignore

      - name: 提取版本号
        id: version
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          VERSION=$(find ./build_dir -name "os-release" | head -1 | xargs grep '^VERSION=' | cut -d= -f2 | tr -d '"[:space:]' | grep -oE "r[0-9]+" || \
                    find ./bin/targets -name "build.version" | head -1 | xargs cat | tr -d '[:space:]' | grep -oE "r[0-9]+" || \
                    git describe --tags --abbrev=0 2>/dev/null | grep -oE "r[0-9]+" || echo "commit-$(git rev-parse --short HEAD)")
          echo "FIRMWARE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.version.outputs.status == 'success'
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          ls -la
          rm -rf packages
          # 只收集 cmcc_rax3000m-emmc (U-Boot mod) 的产物，避免混入 emmc-mtk 的 sysupgrade.bin
          FOUND=0
          for file in *cmcc_rax3000m-emmc*sysupgrade* *cmcc_rax3000m-emmc*factory*; do
            [ -f "$file" ] && ! echo "$file" | grep -q -- "-emmc-mtk" && {
              TYPE=$(echo "$file" | grep -o "sysupgrade\|factory")
              EXT="${file##*.}"
              mv "$file" "${{ env.DEVICE_CODE }}_25dB-on_${{ env.FIRMWARE_VERSION }}_${TYPE}.${EXT}"
              FOUND=1
            }
          done
          [ "$FOUND" -eq 1 ] || { echo "ERROR: 未找到 cmcc_rax3000m-emmc 固件产物 (sysupgrade.itb)"; exit 1; }
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 生成README
        if: steps.version.outputs.status == 'success'
        run: |
          set -e
          cd openwrt/bin/targets/*/*
          cat << EOF > README.md
          # ImmortalWrt 固件说明
          - **固件版本**: ImmortalWrt ${{ env.FIRMWARE_VERSION }}
          - **设备型号**: ${{ env.DEVICE_CODE }}
          - **构建时间**: $(date +"%Y-%m-%d %H:%M %Z")
          - **高功率模式**: ${{ env.ENABLE_5G_25DB == 'true' && '已启用 (5G 25dB)' || '未启用' }}
          - **来源**: ${{ env.REPO_URL }} (分支: ${{ env.REPO_BRANCH }})
          ## 功能
          - 优化网络性能，支持USB共享、HNAT加速、Ksmbd共享等。
          ${{ env.ENABLE_5G_25DB == 'true' && '- 支持 5G 25dB 高功率。' || '' }}
          - 默认地址: 192.168.2.1 (密码空)
          ## 安装
          - U-Boot 刷机: 进入 U-Boot Web 界面，选择 sysupgrade.itb 刷入。
          - 备份配置，使用sysupgrade保留配置，factory全新安装。
          - 通过Web上传.bin文件，重启。
          ## 注意
          第三方固件，自行风险。支持: https://github.com/padavanonly/immortalwrt-mt798x-24.10
          EOF

      - name: 生成发布描述
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.version.outputs.status == 'success'
        run: |
          set -e
          echo "RELEASE_TAG=ImmortalWrt-24.10-${{ env.DEVICE_CODE }}-${{ env.FIRMWARE_VERSION }}" >> $GITHUB_OUTPUT
          cat << EOF > release.txt
          # ImmortalWrt 固件发布
          - **版本**: ImmortalWrt ${{ env.FIRMWARE_VERSION }}
          - **型号**: ${{ env.DEVICE_CODE }}
          - **时间**: $(date +"%Y-%m-%d %H:%M %Z")
          - **5G**: ${{ env.ENABLE_5G_25DB == 'true' && '已启用' || '未启用' }}
          ## 特性
          - 优化性能，支持USB/HNAT/Ksmbd。
          ${{ env.ENABLE_5G_25DB == 'true' && '- 5G 25dB 高功率。' || '' }}
          - 地址: 192.168.2.1 (空密码)
          ## 安装
          U-Boot Web 界面刷入 sysupgrade.itb（U-Boot mod 布局）。
          备份 > 上传sysupgrade/factory > 重启。
          详情见README.md。仓库: https://github.com/padavanonly/immortalwrt-mt798x-24.10
          EOF
          echo "status=success" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*sysupgrade*.*
            ${{ env.FIRMWARE }}/*factory*.*
            ${{ env.FIRMWARE }}/README.md
          overwrite: true

      - name: 上传WebDAV
        if: steps.version.outputs.status == 'success' && env.WEBDAV_URL && env.WEBDAV_USERNAME && env.WEBDAV_PASSWORD
        run: |
          set -e
          FIRMWARE_FILES=$(find openwrt/bin/targets -type f \( -name "*sysupgrade*.*" -o -name "*factory*.*" -o -name "README.md" \) ! -name "*-bl2*")
          [ -z "$FIRMWARE_FILES" ] && { echo "没有找到需要上传的文件"; exit 0; }

          REMOTE_DIR="ImmortalWrt2410"

          curl -s -u "${{ env.WEBDAV_USERNAME }}:${{ env.WEBDAV_PASSWORD }}" -X MKCOL "${{ env.WEBDAV_URL }}/$REMOTE_DIR/" || true

          for FILE in $FIRMWARE_FILES; do
            BASE_NAME=$(basename "$FILE")

            if echo "$BASE_NAME" | grep -q "README"; then
              NEW_NAME="${{ env.DEVICE_CODE }}-README.md"
            else
              NEW_NAME="$BASE_NAME"
            fi

            SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)

            echo "正在上传: $NEW_NAME 到 $REMOTE_DIR ..."
            curl --retry 3 --retry-delay 5 -u "${{ env.WEBDAV_USERNAME }}:${{ env.WEBDAV_PASSWORD }}" \
              -T "$FILE" "${{ env.WEBDAV_URL }}/$REMOTE_DIR/$NEW_NAME" \
              -w "%{http_code}" -o /dev/null || exit 1

            echo "上传成功：$REMOTE_DIR/$NEW_NAME (SHA256: $SHA256)"
          done

      - name: 清理旧发布
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 20 --json tagName --jq ".[] | select(.tagName | startswith(\"ImmortalWrt-24.10-${{ env.DEVICE_CODE }}\")) | .tagName" | tail -n +4 | xargs -I {} -r gh release delete {} --yes || true

      - uses: Mattraks/delete-workflow-runs@v2
        if: steps.tag.outputs.status == 'success'
        with:
          retain_days: 7
          keep_minimum_runs: 3
