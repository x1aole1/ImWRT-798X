name: pc

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '选择设备型号'
        type: choice
        required: true
        options:
          - cmcc_rax3000m
          - cmcc_rax3000me
          - xiaomi_mi-router-ax3000t
          - glinet_gl-mt3000
          - xiaomi_redmi-router-ax6000-stock

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981-ax3000.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part3.sh
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: 'true'
  WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
  WEBDAV_USER: ${{ secrets.WEBDAV_USERNAME }}
  WEBDAV_PASS: ${{ secrets.WEBDAV_PASSWORD }}

jobs:
  build:
    # 核心修改 1：切换为自托管运行器标签
    runs-on: [self-hosted, linux]
    steps:
      - name: 基础环境检查
        uses: actions/checkout@v4

      - name: 初始化自托管环境 & 安装缺失依赖
        run: |
          # 核心修改 2：移除针对官方虚拟机释放磁盘空间的逻辑，仅保留依赖检查与安装
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache
          
          # 使用当前工作区作为编译目录，避免污染宿主机根目录
          mkdir -p openwrt-build-dir

      - name: 克隆源码
        run: |
          # 清理上一次残留的旧源码（由于自托管不会自动销毁容器，需手动清理）
          rm -rf openwrt-build-dir/openwrt || true
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt-build-dir/openwrt
          ln -sfn $PWD/openwrt-build-dir/openwrt $GITHUB_WORKSPACE/openwrt

      # 核心修改 3：移除了 actions/cache 步骤。
      # 自托管服务器不需要通过网络同步缓存，直接通过本地持久化目录进行 dl 和 ccache 提速。

      - name: 更新 Feeds & 执行 DIY 脚本
        run: |
          cd openwrt
          [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ] && cp -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ./feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH && $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH && $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成 .config & 下载软件包
        run: |
          cd openwrt
          [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          
          # 清理旧设备配置
          sed -i '/CONFIG_TARGET_mediatek_filogic_DEVICE_/d' .config || true
          
          # 启用当前设备
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${{ github.event.inputs.device_model }}=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          
          make defconfig
          # 宿主机带宽好、性能强时，download 阶段可直接用多线程
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          
          # 核心修改 4：将 ccache 缓存目录指向宿主机持久化目录，确保跨 Workflow 复用
          export CCACHE_DIR="$HOME/.ccache_openwrt"
          mkdir -p $CCACHE_DIR
          ccache -M 20G
          ccache -z
          
          # 核心修改 5：优化 64 核超高线程编译策略
          # OpenWrt 编译在超高线程（>32）下极易因时序错乱死锁，限制初次编译最大使用 32 线程。
          CPU_CORES=$(nproc)
          if [ $CPU_CORES -gt 32 ]; then
            THREADS=32
          else
            THREADS=$CPU_CORES
          fi
          
          echo "检测到系统实际 CPU 核心数: $CPU_CORES"
          echo "为防止编译死锁，控制最大并行线程数为: $THREADS"
          
          make -j$THREADS || make -j1 V=s
          ccache -s

      - name: 收集与整理固件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages 2>/dev/null || true
          
          DATE_DISPLAY=$(date +'%Y%m%d %H:%M')
          DATE_FILE=$(date +'%Y%m%d_%H%M')
          
          echo "DATE=$DATE_DISPLAY" >> $GITHUB_ENV
          echo "FIRMWARE_VERSION=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "device_code=${{ github.event.inputs.device_model }}" >> $GITHUB_ENV
          
          # 只保留 sysupgrade 文件，并精简名称
          for file in *; do
            [ -f "$file" ] && ! echo "$file" | grep -qE '-(bl2|recovery|sha256sums)' && [[ $file == *sysupgrade* ]] && {
              EXT="${file##*.}"
              NEW_NAME="${{ github.event.inputs.device_model }}_${DATE_FILE}_sysupgrade.${EXT}"
              mv "$file" "$NEW_NAME"
              echo "✅ 固件就绪: $NEW_NAME"
            }
          done
          
          rm -f *factory* *recovery* *-bl2* *sha256sums* 2>/dev/null || true
          
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 删除旧 Release Assets
        if: steps.organize.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `Latest-Build-${{ github.event.inputs.device_model }}`;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
              console.log(`✅ 已删除 ${release.data.assets.length} 个旧固件`);
            } catch (e) {
              console.log("第一次发布或无旧文件，跳过删除");
            }

      - name: 上传至 WebDAV
        if: steps.organize.outputs.status == 'success' && env.WEBDAV_URL != ''
        run: |
          cd ${{ env.FIRMWARE_PATH }}
          for file in *; do
            [ -f "$file" ] && {
              curl -u "${{ env.WEBDAV_USER }}:${{ env.WEBDAV_PASS }}" -X DELETE "${{ env.WEBDAV_URL }}/$file" || true
              curl -k --retry 3 --retry-delay 5 -u "${{ env.WEBDAV_USER }}:${{ env.WEBDAV_PASS }}" -T "$file" "${{ env.WEBDAV_URL }}/$file"
            }
          done

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Latest-Build-${{ github.event.inputs.device_model }}
          files: ${{ env.FIRMWARE_PATH }}/*
          overwrite: true
          body: |
            ## ImmortalWrt-25.12 自动编译
            - **设备型号**: ${{ github.event.inputs.device_model }}
            - **编译时间**: ${{ env.DATE }}
            - **分支**: ${{ env.REPO_BRANCH }}
